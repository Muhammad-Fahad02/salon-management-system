<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LuxeCuts | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">LUXE<span>CUTS</span></div>
        <div class="nav-links"><a href="signup.html">Sign Up</a></div>
    </nav>

    <div class="container">
        <div class="form-box">
            <h2 style="text-align:center;">Login</h2>
            <form id="loginForm">
                <label>Email</label>
                <input type="email" id="loginEmail" required>

                <label>Password</label>
                <input type="password" id="loginPass" required>

                <label>Login As:</label>
                <select id="loginRole">
                    <option value="customer">Customer</option>
                    <option value="staff">Staff / Manager</option>
                </select>

                <button type="submit" class="btn-red" style="width:100%">Login</button>
            </form>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
